services:
  - type: web
    name: ai-tracker-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: API_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false

  - type: worker
    name: ai-tracker-worker
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: arq app.worker.WorkerSettings
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_AI_API_KEY
        sync: false

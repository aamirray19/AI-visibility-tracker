services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: brandmon
      POSTGRES_PASSWORD: brandmon
      POSTGRES_DB: brandmon
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brandmon"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://brandmon:brandmon@postgres:5432/brandmon
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://brandmon:brandmon@postgres:5432/brandmon
      REDIS_URL: redis://redis:6379
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker-pipeline:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://brandmon:brandmon@postgres:5432/brandmon
      REDIS_URL: redis://redis:6379
    command: arq app.worker.settings.PipelineSettings
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker-interactive:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://brandmon:brandmon@postgres:5432/brandmon
      REDIS_URL: redis://redis:6379
    command: arq app.worker.settings.InteractiveSettings
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    env_file: ./frontend/.env
    ports: ["8080:8080"]
    depends_on:
      - api

volumes:
  pgdata:

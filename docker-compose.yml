services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_visibility
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_visibility"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    environment:
      APP_ENV: local
      APP_VERSION: 1.0.0
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ai_visibility
      REDIS_URL: redis://redis:6379/0
      REDIS_KEY_PREFIX: ait:local
      FRONTEND_URL: http://localhost:3000
      AUTH_MODE: mock
      PROVIDER_MODE: mock
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: ["python", "-c", "import time; print('worker placeholder ready', flush=True); time.sleep(3600)"]
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ai_visibility
      REDIS_URL: redis://redis:6379/0
      REDIS_KEY_PREFIX: ait:local
      AUTH_MODE: mock
      PROVIDER_MODE: mock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-anon-key
    ports:
      - "3000:3000"
    depends_on:
      - api
